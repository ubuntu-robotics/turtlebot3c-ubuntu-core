volumes:
  pc:
    # bootloader configuration is shipped and managed by snapd
    schema: gpt
    bootloader: grub
    structure:
      - name: ubuntu-seed
        role: system-seed
        filesystem: vfat
        # UEFI will boot the ESP partition by default first
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        size: 1200M
        update:
          edition: 2
        content:
          - source: grubaa64.efi
            target: EFI/boot/grubaa64.efi
          - source: shim.efi.signed
            target: EFI/boot/bootaa64.efi
      - name: ubuntu-boot
        role: system-boot
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 750M
        update:
          edition: 1
        content:
          - source: grubaa64.efi
            target: EFI/boot/grubaa64.efi
      - name: ubuntu-save
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 32M
      - name: ubuntu-data
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 1G

defaults:
  system:
    service:
      console-conf:
        disable: true
    system:
      hostname: turtlebot3c

  # turtlebot3c-bringup configs
  9QxPQq7N15yTrRVuy8s4NFCWmkZRjtOa:
    lds-model: "LDS-01"
    simulation: true
    turtlebot3-model: "waffle_pi"

  # ros2-nav2 configs
  7KmGS1V786zcoQjSqrYsW1fwEuuESP35:
