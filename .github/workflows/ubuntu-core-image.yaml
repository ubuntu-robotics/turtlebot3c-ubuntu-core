name: TurtleBot3c Ubuntu Core image
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  turtlebot3c-pi-gadget-snap:
    uses: ubuntu-robotics/snap_workflows/.github/workflows/snap.yaml@main
    with:
      snap-name: turtlebot3c-pi
      snapcraft-build-path: pi-gadget
  ubuntu-image:
    runs-on: ubuntu-latest
    needs: turtlebot3c-pi-gadget-snap
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download gadget snap
        uses: actions/download-artifact@v4
        with:
          name: turtlebot3c-pi-${{ github.ref }}
          path: ${{ inputs.snapcraft-build-path }}
      - name: Build image
        run: |
          sudo snap install ubuntu-image
          ubuntu-image snap turtlebot3c.model --snap ./pc-gadget/turtlebot3c-pi_*_arm64.snap
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: turtlebot3c-ubuntu-image
          path: turtlebot3c.img

